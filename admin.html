<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت مستندات</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0d14;
            --bg-card: #121824;
            --border: #2a364f;
            --purple: #a855f7;
            --purple-dark: #7e22ce;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background: var(--bg-base); color: var(--text); padding: 20px; }

        /* Login Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--border); padding: 30px; border-radius: 12px; width: 340px; text-align: center;
        }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #94a3b8; }
        .form-control {
            width: 100%; padding: 10px; background: #1a2233; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem;
        }
        .btn {
            width: 100%; padding: 10px; background: var(--purple); border: none; border-radius: 6px; color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: var(--purple-dark); box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }

        /* Dashboard Layout */
        .dashboard { display: none; max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }

        /* Drag and Drop Zone */
        .drop-zone {
            border: 2px dashed var(--purple);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: rgba(168, 85, 247, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(168, 85, 247, 0.2);
            border-color: #c084fc;
        }

        /* Status Toast */
        .status-msg {
            display: none; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: 600; text-align: center;
        }
        .status-success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; }
        .status-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }
    </style>
</head>
<body>

    <!-- مودال ورود -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h2 style="margin-bottom: 20px; color: var(--purple);">ورود به پنل مدیریت</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>نام کاربری:</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>رمز عبور:</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn">ورود</button>
            </form>
            <p id="loginError" style="color: #f87171; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- داشبورد اصلی -->
    <div class="dashboard" id="adminDashboard">
        <div class="header">
            <h2>⚙️ مدیریت دروس و محتوا</h2>
            <button class="btn" style="width: auto; background: #dc2626;" onclick="logout()">خروج</button>
        </div>

        <div id="statusMessage" class="status-msg"></div>

        <!-- تنظیمات گیت هاب -->
        <div class="card">
            <h3>🌐 انتشار بر روی GitHub Pages</h3>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="repoPath" class="form-control" placeholder="amir1389izady/نام_ریپازیتوری">
                <input type="password" id="ghToken" class="form-control" placeholder="توکن شخصی گیت‌هاب (ghp_...)">
                <button class="btn" style="width: 200px;" onclick="AdminManager.commitToGitHub()">انتشار تغییرات</button>
            </div>
        </div>

        <div class="grid">
            <!-- مدیریت فصل‌ها و ساختار -->
            <div>
                <div class="card">
                    <h3>➕ افزودن فصل جدید</h3>
                    <div style="display: flex; gap: 8px; margin-top: 10px;">
                        <input type="text" id="newChapterTitle" class="form-control" placeholder="عنوان فصل...">
                        <button class="btn" style="width: 100px;" onclick="AdminManager.addChapter()">افزودن</button>
                    </div>
                </div>

                <div class="card">
                    <h3>📂 ساختار دوره</h3>
                    <div id="chaptersAdminList" style="margin-top: 10px;"></div>
                </div>
            </div>

            <!-- فرم مدیریت و آپلود درس -->
            <div>
                <div class="card">
                    <h3 id="formTitle">➕ افزودن / ویرایش درس</h3>
                    <form id="lessonForm" style="margin-top: 15px;">
                        <input type="hidden" id="editLessonId">
                        
                        <div class="form-group">
                            <label>انتخاب فصل:</label>
                            <select id="chapterSelect" class="form-control" required></select>
                        </div>

                        <div class="form-group">
                            <label>عنوان درس:</label>
                            <input type="text" id="lessonTitleInput" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>کد یوتیوب (YouTube ID):</label>
                            <input type="text" id="youtubeIdInput" class="form-control" placeholder="مثال: dQw4w9WgXcQ">
                        </div>

                        <div class="form-group">
                            <label>آپلود سریع فایل داکیومنت (Drag & Drop):</label>
                            <div class="drop-zone" id="dropZone">
                                📁 فایل متنی یا HTML را بکشید و رها کنید
                                <input type="file" id="fileInput" style="display: none;">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>متن و کد داکیومنت (HTML):</label>
                            <textarea id="docHtmlInput" class="form-control" rows="6"></textarea>
                        </div>

                        <div class="form-group">
                            <label>لینک مستقیم فایل دانلود ضمیمه:</label>
                            <input type="text" id="downloadUrlInput" class="form-control" placeholder="https://...">
                        </div>

                        <div style="display: flex; gap: 10px;">
                            <button type="submit" id="submitBtn" class="btn">ذخیره درس</button>
                            <button type="button" class="btn" style="background: #475569;" onclick="AdminManager.resetForm()">انصراف</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        // افزودن قابلیت Drag and Drop مستقیم
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        if (dropZone) {
            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) handleFileUpload(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) handleFileUpload(fileInput.files[0]);
            });
        }

        function handleFileUpload(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('docHtmlInput').value = e.target.result;
                alert(`محتوای فایل "${file.name}" در کادر داکیومنت جایگذاری شد.`);
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
