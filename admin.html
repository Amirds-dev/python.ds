<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت مستندات</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-card: #151d2a;
            --border-color: #27354a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; padding: 20px; }

        /* Login Modal */
        .login-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 15, 25, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: var(--bg-card); padding: 32px; border-radius: 12px;
            border: 1px solid var(--border-color); width: 100%; max-width: 380px;
        }
        .login-box h2 { color: var(--accent); margin-bottom: 20px; text-align: center; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-muted); }
        .form-control {
            width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid var(--border-color);
            border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none;
        }
        .form-control:focus { border-color: var(--accent); }

        .btn {
            width: 100%; padding: 10px; background: var(--accent); color: #0b0f19;
            font-weight: 700; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }

        /* Admin Layout */
        .admin-container { max-width: 1100px; margin: 0 auto; display: none; }
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 24px;
        }

        .github-config {
            background: var(--bg-card); padding: 16px; border-radius: 8px;
            border: 1px solid var(--border-color); margin-bottom: 24px;
        }
        .github-config h3 { font-size: 1rem; color: var(--accent); margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .admin-grid { display: grid; grid-template-columns: 350px 1fr; gap: 24px; }
        .panel-box {
            background: var(--bg-card); padding: 20px; border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .panel-box h3 { margin-bottom: 16px; color: var(--accent); font-size: 1.1rem; }

        textarea.form-control { height: 160px; resize: vertical; font-family: monospace; }
        
        .chapter-admin-item {
            background: #0f172a; border: 1px solid var(--border-color);
            border-radius: 6px; margin-bottom: 10px; padding: 10px;
        }
        .chapter-admin-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
        .lesson-admin-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px; background: #1a2436; margin-top: 4px; border-radius: 4px; font-size: 0.85rem;
        }
        .action-btns { display: flex; gap: 6px; }
        .sm-btn { padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; border: none; }

        .status-msg { margin-top: 10px; padding: 10px; border-radius: 6px; display: none; text-align: center; }
        .status-success { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status-error { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    </style>
</head>
<body>

    <!-- Login Dialog -->
    <div class="login-overlay" id="loginModal">
        <div class="login-box">
            <h2>ورود به پنل مدیریت</h2>
            <div class="form-group">
                <label>نام کاربری:</label>
                <input type="text" id="username" class="form-control" placeholder="نام کاربری">
            </div>
            <div class="form-group">
                <label>رمز عبور:</label>
                <input type="password" id="password" class="form-control" placeholder="رمز عبور">
            </div>
            <button class="btn" onclick="checkAuth()">ورود</button>
            <div id="loginError" style="color: var(--danger); margin-top: 10px; font-size: 0.85rem; text-align: center;"></div>
        </div>
    </div>

    <!-- Main Admin Dashboard -->
    <div class="admin-container" id="adminDashboard">
        <header class="admin-header">
            <h2>⚙️ پنل مدیریت مستندات (JSON Database Manager)</h2>
            <button class="btn btn-danger" style="width: auto; padding: 8px 16px;" onclick="logout()">خروج</button>
        </header>

        <!-- GitHub Integration Box -->
        <div class="github-config">
            <h3>🔑 تنظیمات همگام‌سازی با GitHub Pages (اختیاری برای انتشار آنلاین)</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>نام کاربری گیت‌هاب / اسم ریپازیتوری (مثال: username/repository):</label>
                    <input type="text" id="repoPath" class="form-control" placeholder="Username/repo">
                </div>
                <div class="form-group">
                    <label>توکن شخص گیت‌هاب (Personal Access Token):</label>
                    <input type="password" id="ghToken" class="form-control" placeholder="ghp_xxxxxxxxxxxx">
                </div>
            </div>
        </div>

        <div class="admin-grid">
            <!-- Sidebar: Chapters & Lessons Tree -->
            <div class="panel-box">
                <h3>📚 ساختار دروس</h3>
                <div class="form-group">
                    <input type="text" id="newChapterTitle" class="form-control" placeholder="عنوان فصل جدید...">
                    <button class="btn" style="margin-top: 8px;" onclick="AdminManager.addChapter()">+ افزودن فصل</button>
                </div>
                <hr style="border-color: var(--border-color); margin: 16px 0;">
                <div id="chaptersAdminList"></div>
            </div>

            <!-- Form: Add / Edit Lesson -->
            <div class="panel-box">
                <h3 id="formTitle">➕ افزودن درس جدید</h3>
                <form id="lessonForm" onsubmit="event.preventDefault(); AdminManager.saveLesson();">
                    <input type="hidden" id="editLessonId">
                    <div class="form-group">
                        <label>انتخاب فصل:</label>
                        <select id="chapterSelect" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label>عنوان درس:</label>
                        <input type="text" id="lessonTitleInput" class="form-control" required placeholder="مثلاً: درس ۱: نصب ابزارها">
                    </div>
                    <div class="form-group">
                        <label>شناسه ویدیو یوتیوب (YouTube Video ID):</label>
                        <input type="text" id="youtubeIdInput" class="form-control" required placeholder="کد ۱۱ رقمی مثل: dQw4w9WgXcQ">
                    </div>
                    <div class="form-group">
                        <label>متن و داکیومنت (HTML/کد):</label>
                        <textarea id="docHtmlInput" class="form-control" required placeholder="متن داکیومنت و کدها به همراه تگ‌های HTML..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>لینک دانلود فایل ضمیمه (دانلود داکیومنت):</label>
                        <input type="text" id="downloadUrlInput" class="form-control" placeholder="https://...">
                    </div>

                    <button type="submit" class="btn" id="submitBtn">ذخیره درس</button>
                </form>

                <hr style="border-color: var(--border-color); margin: 20px 0;">

                <div style="display: flex; gap: 10px;">
                    <button class="btn" style="background: #22c55e;" onclick="AdminManager.exportJSON()">دانلود فایل JSON جدید</button>
                    <button class="btn" style="background: #6366f1;" onclick="AdminManager.commitToGitHub()">ارسال مستقیم به GitHub Pages 🚀</button>
                </div>

                <div id="statusMessage" class="status-msg"></div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
