<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه جامع آموزش و مستندات</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-side: #1e293b;
            --bg-card: #182232;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --code-bg: #090d16;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 320px;
            background-color: var(--bg-side);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 700;
        }

        .sidebar-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .chapters-list {
            overflow-y: auto;
            flex: 1;
            padding: 12px;
        }

        .chapter-item {
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-card);
        }

        .chapter-title {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .chapter-title:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .arrow-icon {
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .chapter-item.open .arrow-icon {
            transform: rotate(-90deg);
            color: var(--accent);
        }

        .lessons-tree {
            display: none;
            list-style: none;
            background: var(--bg-side);
            padding: 6px 0;
            border-top: 1px solid var(--border-color);
        }

        .chapter-item.open .lessons-tree {
            display: block;
        }

        .lesson-btn {
            width: 100%;
            padding: 10px 20px;
            text-align: right;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .lesson-btn:hover {
            color: var(--accent);
            background: rgba(56, 189, 248, 0.08);
        }

        .lesson-btn.active {
            color: var(--accent);
            background: rgba(56, 189, 248, 0.12);
            font-weight: 600;
            border-right: 3px solid var(--accent);
        }

        /* Main Area */
        .main-content {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 32px;
            gap: 20px;
            overflow: hidden;
        }

        .lesson-header h1 {
            font-size: 1.6rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .video-wrapper {
            width: 100%;
            max-width: 950px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Internal Scroll Document Box */
        .doc-container {
            flex: 1;
            background: var(--bg-side);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-width: 950px;
        }

        .doc-header {
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .doc-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            line-height: 1.8;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .doc-body h2, .doc-body h3 {
            color: var(--text-main);
            margin: 16px 0 8px 0;
        }

        .doc-body ul, .doc-body ol {
            margin-right: 20px;
            margin-bottom: 12px;
        }

        .doc-body pre {
            background-color: var(--code-bg);
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            direction: ltr;
            text-align: left;
            font-family: monospace;
            color: var(--accent);
            margin: 14px 0;
            overflow-x: auto;
        }

        .doc-footer {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--accent);
            color: #0f172a;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-download:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            .sidebar {
                width: 100%;
                height: auto;
            }
            .main-content {
                height: auto;
                overflow: visible;
                padding: 16px;
            }
            .doc-container {
                height: 450px;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>مستندات و آموزش‌ها</h2>
            <p>سرفصل‌ها و دروس دوره</p>
        </div>
        <div class="chapters-list" id="chaptersContainer"></div>
    </aside>

    <main class="main-content">
        <div class="lesson-header">
            <h1 id="lessonTitle">در حال بارگذاری...</h1>
        </div>

        <div class="video-wrapper">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>

        <div class="doc-container">
            <div class="doc-header">📄 داکیومنت و راهنمای این جلسه</div>
            <div class="doc-body" id="docContent"></div>
            <div class="doc-footer">
                <a href="#" id="downloadBtn" class="btn-download" target="_blank" download>
                    📥 دانلود فایل ضمیمه
                </a>
            </div>
        </div>
    </main>

    <script>
        let globalLessonsData = [];

        function loadData() {
            fetch('lessons.json')
                .then(res => res.json())
                .then(data => {
                    globalLessonsData = data;
                    renderSidebar();
                    if(data.length > 0 && data[0].lessons.length > 0) {
                        selectLesson(data[0].lessons[0].id);
                    }
                })
                .catch(err => {
                    console.error("خطا در بارگذاری JSON:", err);
                    document.getElementById('lessonTitle').textContent = "خطا در بارگذاری اطلاعات!";
                });
        }

        function renderSidebar() {
            const container = document.getElementById('chaptersContainer');
            container.innerHTML = '';

            globalLessonsData.forEach((chapter, chapterIdx) => {
                const chapterEl = document.createElement('div');
                chapterEl.className = `chapter-item ${chapterIdx === 0 ? 'open' : ''}`;

                chapterEl.innerHTML = `
                    <button class="chapter-title" onclick="toggleChapter(this)">
                        <span>${chapter.chapterTitle}</span>
                        <span class="arrow-icon">◀</span>
                    </button>
                    <ul class="lessons-tree">
                        ${chapter.lessons.map((lesson, lessonIdx) => `
                            <li>
                                <button class="lesson-btn ${chapterIdx === 0 && lessonIdx === 0 ? 'active' : ''}" 
                                        id="btn-${lesson.id}"
                                        onclick="selectLesson('${lesson.id}')">
                                    ▶ ${lesson.title}
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                `;
                container.appendChild(chapterEl);
            });
        }

        function toggleChapter(btn) {
            btn.parentElement.classList.toggle('open');
        }

        function selectLesson(lessonId) {
            document.querySelectorAll('.lesson-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${lessonId}`);
            if(activeBtn) activeBtn.classList.add('active');

            let selected = null;
            for (const ch of globalLessonsData) {
                const found = ch.lessons.find(l => l.id === lessonId);
                if (found) { selected = found; break; }
            }

            if (selected) {
                document.getElementById('lessonTitle').textContent = selected.title;
                document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${selected.youtubeId}`;
                document.getElementById('docContent').innerHTML = selected.docHtml;
                document.getElementById('downloadBtn').href = selected.downloadUrl || '#';
            }
        }

        loadData();
    </script>
</body>
</html>
