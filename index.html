<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه جامع آموزش و مستندات</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0d14;
            --bg-side: #121824;
            --bg-card: #1a2233;
            --border-color: #2a364f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --purple-glow: #a855f7;
            --purple-hover: #9333ea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 320px;
            background-color: var(--bg-side);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 700;
        }

        .chapters-list {
            overflow-y: auto;
            flex: 1;
            padding: 12px;
        }

        .chapter-item {
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-card);
            transition: all 0.3s ease;
        }

        /* Hover Effect for Chapters */
        .chapter-item:hover {
            border-color: var(--purple-glow);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        .chapter-title {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .lessons-tree {
            display: none;
            list-style: none;
            background: var(--bg-side);
            padding: 6px 0;
            border-top: 1px solid var(--border-color);
        }

        .chapter-item.open .lessons-tree {
            display: block;
        }

        .lesson-btn {
            width: 100%;
            padding: 10px 20px;
            text-align: right;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text-muted);
            transition: all 0.25s ease;
        }

        /* Hover Effect for Lesson Buttons */
        .lesson-btn:hover {
            color: #fff;
            background: var(--purple-hover);
            padding-right: 25px;
            box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .lesson-btn.active {
            color: #fff;
            background: var(--purple-glow);
            font-weight: 700;
            border-right: 4px solid #fff;
        }

        /* Main Content Layout */
        .main-content {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
            overflow-y: auto;
        }

        .lesson-header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .video-wrapper {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .video-wrapper:hover {
            border-color: var(--purple-glow);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Document Box with Purple Glow & Visible Download Button */
        .doc-container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-side);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .doc-container:hover {
            border-color: var(--purple-glow);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .doc-header {
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .doc-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent);
        }

        /* Glowing Purple Download Button */
        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .btn-download:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #c084fc, #9333ea);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.8), 0 0 40px rgba(147, 51, 234, 0.6);
            color: #fff;
        }

        .doc-body {
            padding: 20px;
            line-height: 1.8;
            color: #cbd5e1;
            font-size: 0.95rem;
            min-height: 120px;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>مستندات و آموزش‌ها</h2>
        </div>
        <div class="chapters-list" id="chaptersContainer"></div>
    </aside>

    <main class="main-content">
        <div class="lesson-header">
            <h1 id="lessonTitle">در حال بارگذاری...</h1>
        </div>

        <div class="video-wrapper">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>

        <div class="doc-container">
            <div class="doc-header">
                <span class="doc-title">📄 داکیومنت و راهنما</span>
                <!-- دکمه دانلود کاملاً واضح در بالا -->
                <a href="#" id="downloadBtn" class="btn-download" target="_blank" download>
                    📥 دانلود فایل ضمیمه
                </a>
            </div>
            <div class="doc-body" id="docContent"></div>
        </div>
    </main>

    <script>
        let globalLessonsData = [];

        function loadData() {
            fetch('lessons.json')
                .then(res => res.json())
                .then(data => {
                    globalLessonsData = data;
                    renderSidebar();
                    if(data.length > 0 && data[0].lessons.length > 0) {
                        selectLesson(data[0].lessons[0].id);
                    }
                });
        }

        function renderSidebar() {
            const container = document.getElementById('chaptersContainer');
            container.innerHTML = '';

            globalLessonsData.forEach((chapter, chapterIdx) => {
                const chapterEl = document.createElement('div');
                chapterEl.className = `chapter-item ${chapterIdx === 0 ? 'open' : ''}`;

                chapterEl.innerHTML = `
                    <button class="chapter-title" onclick="toggleChapter(this)">
                        <span>${chapter.chapterTitle}</span>
                        <span>◀</span>
                    </button>
                    <ul class="lessons-tree">
                        ${chapter.lessons.map((lesson, lessonIdx) => `
                            <li>
                                <button class="lesson-btn ${chapterIdx === 0 && lessonIdx === 0 ? 'active' : ''}" 
                                        id="btn-${lesson.id}"
                                        onclick="selectLesson('${lesson.id}')">
                                    🔹 ${lesson.title}
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                `;
                container.appendChild(chapterEl);
            });
        }

        function toggleChapter(btn) {
            btn.parentElement.classList.toggle('open');
        }

        function selectLesson(lessonId) {
            document.querySelectorAll('.lesson-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${lessonId}`);
            if(activeBtn) activeBtn.classList.add('active');

            let selected = null;
            for (const ch of globalLessonsData) {
                const found = ch.lessons.find(l => l.id === lessonId);
                if (found) { selected = found; break; }
            }

            if (selected) {
                document.getElementById('lessonTitle').textContent = selected.title;
                document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${selected.youtubeId}`;
                document.getElementById('docContent').innerHTML = selected.docHtml;
                document.getElementById('downloadBtn').href = selected.downloadUrl || '#';
            }
        }

        loadData();
    </script>
</body>
</html>
