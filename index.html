<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه جامع آموزش و مستندات</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0d14;
            --bg-side: #121824;
            --bg-card: #1a2233;
            --border-color: #2a364f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --purple-glow: #a855f7;
            --purple-hover: #9333ea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Glow Cursor Effect */
        .cursor-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
            z-index: 9999;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 320px;
            background-color: var(--bg-side);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            flex-shrink: 0;
            z-index: 2;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 700;
        }

        .btn-home {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid var(--purple-glow);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: var(--purple-glow);
            box-shadow: 0 0 10px var(--purple-glow);
        }

        .chapters-list {
            overflow-y: auto;
            flex: 1;
            padding: 12px;
        }

        .chapter-item {
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-card);
            transition: all 0.3s ease;
        }

        .chapter-item:hover {
            border-color: var(--purple-glow);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            transform: translateY(-2px);
        }

        .chapter-title {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .lessons-tree {
            display: none;
            list-style: none;
            background: var(--bg-side);
            padding: 6px 0;
            border-top: 1px solid var(--border-color);
        }

        .chapter-item.open .lessons-tree {
            display: block;
        }

        .lesson-btn {
            width: 100%;
            padding: 10px 20px;
            text-align: right;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text-muted);
            transition: all 0.25s ease;
        }

        .lesson-btn:hover {
            color: #fff;
            background: var(--purple-hover);
            padding-right: 25px;
            box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .lesson-btn.active {
            color: #fff;
            background: var(--purple-glow);
            font-weight: 700;
            border-right: 4px solid #fff;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
            overflow-y: auto;
            z-index: 2;
        }

        .lesson-header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .video-wrapper {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .video-wrapper:hover {
            border-color: var(--purple-glow);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .doc-container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-side);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .doc-container:hover {
            border-color: var(--purple-glow);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .doc-header {
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .doc-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent);
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .btn-download:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #c084fc, #9333ea);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.8);
        }

        .doc-body {
            padding: 20px;
            line-height: 1.8;
            color: #cbd5e1;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="cursor-glow" id="cursorGlow"></div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>مستندات و آموزش‌ها</h2>
            <button class="btn-home" onclick="showHomePage()">🏠 صفحه اصلی</button>
        </div>
        <div class="chapters-list" id="chaptersContainer"></div>
    </aside>

    <main class="main-content">
        <div class="lesson-header">
            <h1 id="lessonTitle">سلام! به دوره آموزشی خوش آمدید</h1>
        </div>

        <div class="video-wrapper">
            <iframe id="videoPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        </div>

        <div class="doc-container">
            <div class="doc-header">
                <span class="doc-title" id="docHeaderTitle">📄 درباره من و معرفی دوره</span>
                <a href="#" id="downloadBtn" class="btn-download" target="_blank" download style="display: none;">
                    📥 دانلود فایل ضمیمه
                </a>
            </div>
            <div class="doc-body" id="docContent">
                <h3>درباره مدرس و این دوره</h3>
                <p>سلام! من امیر هستم. در این دوره قراره قدم به قدم با مباحث مختلف آشنا بشیم.</p>
                <p>از منوی سمت راست می‌توانید فصل‌ها را باز کرده و درس مورد نظر خود را انتخاب کنید.</p>
            </div>
        </div>
    </main>

    <script>
        let globalLessonsData = [];

        // تعقیب نورانی موس
        const glow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        function loadData() {
            fetch('lessons.json')
                .then(res => res.json())
                .then(data => {
                    globalLessonsData = data;
                    renderSidebar();
                    showHomePage(); // اجرا در حالت پیش‌فرض روی صفحه اصلی
                })
                .catch(err => console.warn("دیتا بارگذاری نشد:", err));
        }

        function renderSidebar() {
            const container = document.getElementById('chaptersContainer');
            container.innerHTML = '';

            globalLessonsData.forEach((chapter, chapterIdx) => {
                const chapterEl = document.createElement('div');
                chapterEl.className = `chapter-item ${chapterIdx === 0 ? 'open' : ''}`;

                chapterEl.innerHTML = `
                    <button class="chapter-title" onclick="toggleChapter(this)">
                        <span>${chapter.chapterTitle}</span>
                        <span>◀</span>
                    </button>
                    <ul class="lessons-tree">
                        ${chapter.lessons.map((lesson) => `
                            <li>
                                <button class="lesson-btn" id="btn-${lesson.id}" onclick="selectLesson('${lesson.id}', '${chapter.chapterTitle}')">
                                    🔹 ${lesson.title}
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                `;
                container.appendChild(chapterEl);
            });
        }

        function toggleChapter(btn) {
            btn.parentElement.classList.toggle('open');
        }

        function showHomePage() {
            document.querySelectorAll('.lesson-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('lessonTitle').textContent = "👋 درباره من و معرفی دوره";
            document.getElementById('docHeaderTitle').textContent = "📄 درباره دوره";
            document.getElementById('videoPlayer').src = "https://www.youtube.com/embed/dQw4w9WgXcQ";
            document.getElementById('docContent').innerHTML = `
                <h3>به سامانه آموزشی خوش آمدید</h3>
                <p>برای شروع یادگیری، از منوی سمت راست روی فصل و درس مورد نظر خود کلیک کنید.</p>
            `;
            document.getElementById('downloadBtn').style.display = 'none';
        }

        function selectLesson(lessonId, chapterTitle) {
            document.querySelectorAll('.lesson-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${lessonId}`);
            if(activeBtn) activeBtn.classList.add('active');

            let selected = null;
            for (const ch of globalLessonsData) {
                const found = ch.lessons.find(l => l.id === lessonId);
                if (found) { selected = found; break; }
            }

            if (selected) {
                // نمایش نام فصل به همراه نام درس
                document.getElementById('lessonTitle').textContent = `${chapterTitle} ➔ ${selected.title}`;
                document.getElementById('docHeaderTitle').textContent = `📄 داکیومنت: ${selected.title}`;
                document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${selected.youtubeId}`;
                document.getElementById('docContent').innerHTML = selected.docHtml || '<p>داکیومنتی ثبت نشده است.</p>';
                
                const dlBtn = document.getElementById('downloadBtn');
                if (selected.downloadUrl && selected.downloadUrl.trim() !== "") {
                    dlBtn.href = selected.downloadUrl;
                    dlBtn.style.display = 'inline-flex';
                } else {
                    dlBtn.style.display = 'none';
                }
            }
        }

        loadData();
    </script>
</body>
</html>
